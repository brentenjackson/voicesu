[package]
name = "voicesu-formants"
version = "0.1.0"
edition = "2021"
publish = false
description = "voicesu's per-frame formant pipeline (js/dsp.js, js/engines/lpc.js) as WebAssembly"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
